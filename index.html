<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="description" content="Last Bastion - A medieval fantasy tower defense game. Defend your kingdom against goblin and orc hordes!" />
  <title>Last Bastion - Tower Defense</title>
  <link rel="icon" href="/icon.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0a0a12;
      font-family: 'Inter', sans-serif;
    }
    #game-canvas {
      display: block;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      cursor: default;
      touch-action: none;
    }
    #loading-screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0a0a12, #1a1a2e);
      z-index: 1000; color: #f0e6d2;
      font-family: 'MedievalSharp', cursive;
    }
    #loading-screen h1 {
      font-size: 3rem; margin-bottom: 1.5rem;
      text-shadow: 0 0 20px rgba(255,200,80,0.5);
      color: #ffd866;
    }
    .loading-bar-bg {
      width: 300px; height: 12px;
      background: rgba(255,255,255,0.1);
      border-radius: 6px; overflow: hidden;
      border: 1px solid rgba(255,200,80,0.3);
    }
    .loading-bar-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #e67e22, #ffd866);
      border-radius: 6px;
      transition: width 0.2s;
    }
    #loading-text {
      margin-top: 0.8rem; font-size: 0.9rem;
      color: #8a8a9a; font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <h1>⚔ Last Bastion ⚔</h1>
    <div class="loading-bar-bg">
      <div class="loading-bar-fill" id="loading-bar"></div>
    </div>
    <div id="loading-text">Preparing the battlefield...</div>
  </div>
  <canvas id="game-canvas"></canvas>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
